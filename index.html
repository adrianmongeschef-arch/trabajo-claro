<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trabajo Claro</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #030712;
      color: #f9fafb;
      font-family: sans-serif;
    }
    .caja {
      max-width: 480px;
      margin: 0 auto;
      background: #111827;
      border: 1px solid #38bdf8;
      border-radius: 16px;
      padding: 20px;
    }
    h1 {
      color: #38bdf8;
      font-size: 24px;
      margin-top: 0;
    }
    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: none;
      border-radius: 10px;
      background: #f59e0b;
      color: #030712;
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
    }
    #panel {
      display: none;
      margin-top: 16px;
      padding: 14px;
      background: #030712;
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <div class="caja">
    <h1>Trabajo Claro</h1>
    <p>Pantalla base activa sin bloqueos.</p>
    <button onclick="abrirPanel()">Entrar a Admin</button>
    <div id="panel">
      <strong>Panel Admin activo</strong>
      <p id="estado"></p>
    </div>
  </div>
  <script>
    function abrirPanel() {
      document.getElementById('panel').style.display = 'block';
      document.getElementById('estado').innerText = 'Funciona correctamente en el navegador.';
    }
  </script>
</body>
</html>
