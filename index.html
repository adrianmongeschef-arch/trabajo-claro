<!DOCTYPE html>
<html lang="es" style="background-color: #030712;">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0284c7">
  <title>Trabajo Claro | Portal de Empleos Verificados</title>
  <style>
    :root {
      --bg: #030712;
      --card-bg: #111827;
      --card-border: #1f2937;
      --primary: #38bdf8;
      --primary-dark: #0284c7;
      --accent: #10b981;
      --text-main: #f9fafb;
      --text-muted: #9ca3af;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text-main); padding: 16px; max-width: 600px; margin: 0 auto; padding-bottom: 95px; }

    #intro-screen {
      position: fixed; inset: 0; background: linear-gradient(145deg, #07192f 0%, #0284c7 100%);
      z-index: 99999; display: flex; align-items: center; justify-content: center; padding: 20px; text-align: center; max-width: 600px; margin: 0 auto;
    }
    .splash-card {
      background: rgba(3, 7, 18, 0.85); backdrop-filter: blur(14px); border: 1px solid rgba(56, 189, 248, 0.35);
      padding: 32px 22px; border-radius: 24px; width: 100%; max-width: 400px; box-shadow: 0 25px 50px rgba(0,0,0,0.7);
    }
    .splash-badge {
      display: inline-block; background: rgba(56, 189, 248, 0.15); color: var(--primary);
      font-size: 11px; font-weight: 800; padding: 5px 12px; border-radius: 99px; margin-bottom: 14px; text-transform: uppercase;
    }
    .splash-title { font-size: 30px; font-weight: 900; color: #fff; margin-bottom: 8px; }
    .splash-title span { color: var(--primary); }
    .splash-desc { font-size: 13.5px; color: #cbd5e1; margin-bottom: 20px; line-height: 1.5; }
    .splash-pillars { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 24px; }
    .pillar-box { background: rgba(17, 24, 39, 0.9); border: 1px solid rgba(56, 189, 248, 0.2); border-radius: 12px; padding: 10px 6px; }
    .pillar-icon { font-size: 18px; margin-bottom: 4px; }
    .pillar-text { font-size: 11px; font-weight: 700; color: #f8fafc; }
    .btn-splash {
      width: 100%; background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%); color: #030712;
      border: none; padding: 15px; border-radius: 12px; font-weight: 900; font-size: 15px; cursor: pointer; box-shadow: 0 4px 15px rgba(56, 189, 248, 0.4);
    }

    .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--card-border); margin-bottom: 16px; }
    .logo-text { font-weight: 900; font-size: 17px; color: var(--primary); cursor: pointer; display: flex; align-items: center; gap: 6px; }
    .nav-actions { display: flex; gap: 6px; }
    .nav-btn { background: var(--card-bg); color: var(--text-main); border: 1px solid var(--card-border); padding: 7px 12px; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; }
    .nav-btn-primary { background: rgba(56, 189, 248, 0.15); color: var(--primary); border-color: rgba(56, 189, 248, 0.35); }

    header { padding: 14px 12px 20px; text-align: center; background: linear-gradient(180deg, rgba(17,24,39,0.8) 0%, rgba(3,7,18,0) 100%); border-radius: 20px; margin-bottom: 16px; border: 1px solid rgba(31, 41, 55, 0.6); }
    .verified-badge { display: inline-flex; align-items: center; gap: 6px; background: rgba(16, 185, 129, 0.12); color: var(--accent); font-size: 11px; font-weight: 800; padding: 6px 14px; border-radius: 99px; margin-bottom: 12px; border: 1px solid rgba(16, 185, 129, 0.3); text-transform: uppercase; }
    h1 { font-size: 28px; font-weight: 900; }
    h1 span { color: var(--primary); }
    .subtitle { color: #cbd5e1; font-size: 13.5px; margin-top: 8px; line-height: 1.5; max-width: 460px; margin-left: auto; margin-right: auto; }
    
    .hero-cta-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; }
    .btn-hero-cand { background: var(--accent); color: #030712; border: none; padding: 12px 10px; border-radius: 12px; font-weight: 800; font-size: 13px; cursor: pointer; }
    .btn-hero-emp { background: var(--card-bg); color: var(--primary); border: 1px solid rgba(56, 189, 248, 0.4); padding: 12px 10px; border-radius: 12px; font-weight: 800; font-size: 13px; cursor: pointer; }

    .value-section { display: grid; gap: 12px; margin-bottom: 22px; }
    .value-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; padding: 18px; }
    .value-card.emp-highlight { border-left: 4px solid var(--primary); }
    .value-card.cand-highlight { border-left: 4px solid var(--accent); }
    .value-header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .value-title { font-size: 15px; font-weight: 800; color: #fff; }
    .value-list { list-style: none; display: grid; gap: 8px; }
    .value-list li { font-size: 12.5px; color: #cbd5e1; line-height: 1.45; display: flex; align-items: flex-start; gap: 8px; }
    .check-blue { color: var(--primary); font-weight: 900; }
    .check-green { color: var(--accent); font-weight: 900; }

    .section-heading { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding: 0 4px; }
    .section-heading h2 { font-size: 17px; font-weight: 800; color: #fff; }
    .section-heading span { font-size: 11px; color: var(--accent); font-weight: 700; }

    .jobs-container { display: grid; gap: 14px; }
    .card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 18px; padding: 20px; position: relative; overflow: hidden; }
    .card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--primary); }
    .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 8px; }
    .job-title { font-size: 18px; font-weight: 800; color: #fff; }
    .company { font-size: 13px; color: var(--text-muted); margin-top: 3px; }
    .salary-badge { background: rgba(16, 185, 129, 0.15); color: #34d399; font-weight: 800; font-size: 13px; padding: 6px 12px; border-radius: 10px; border: 1px solid rgba(16, 185, 129, 0.3); white-space: nowrap; }
    .job-meta { font-size: 11.5px; color: var(--text-muted); margin-bottom: 8px; display: flex; gap: 8px; align-items: center; }
    .btn-apply { width: 100%; background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%); color: #030712; border: none; padding: 13px; border-radius: 12px; font-weight: 800; font-size: 14px; cursor: pointer; margin-top: 6px; }
    .btn-close-job { width: 100%; background: rgba(239, 68, 68, 0.14); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.35); padding: 9px; border-radius: 10px; font-weight: 700; font-size: 12px; cursor: pointer; margin-top: 8px; }

    .legal-box { margin-top: 24px; padding: 16px; background: rgba(17, 24, 39, 0.75); border: 1px solid var(--card-border); border-radius: 16px; font-size: 11.5px; color: var(--text-muted); line-height: 1.5; }
    .legal-box-title { font-size: 13px; font-weight: 800; color: #f8fafc; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
    .legal-list { list-style: none; display: grid; gap: 6px; margin-bottom: 12px; }
    .legal-link-btn { background: transparent; border: 1px solid rgba(56, 189, 248, 0.35); color: var(--primary); padding: 8px 12px; border-radius: 8px; font-size: 11.5px; font-weight: 700; cursor: pointer; width: 100%; }

    .trust-footer { margin-top: 14px; padding: 12px; text-align: center; font-size: 11px; color: var(--text-muted); line-height: 1.5; }
    .trust-footer strong { color: #e2e8f0; }

    .section-view { display: none; background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 18px; padding: 22px; margin-top: 10px; }
    .section-view h2 { font-size: 20px; font-weight: 800; margin-bottom: 6px; color: #fff; }
    .section-view p { font-size: 13px; color: var(--text-muted); margin-bottom: 18px; }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 12px; font-weight: 700; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--card-border); background: var(--bg); color: #fff; font-size: 14px; outline: none; }
    .terms-check { display: flex; align-items: flex-start; gap: 8px; font-size: 11.5px; color: #cbd5e1; margin-bottom: 14px; line-height: 1.4; }
    .terms-check input { width: auto; margin-top: 2px; }
    .btn-submit { width: 100%; background: var(--accent); color: #030712; border: none; padding: 13px; border-radius: 12px; font-weight: 800; font-size: 14px; cursor: pointer; margin-top: 6px; }
    .btn-super-admin { width: 100%; background: #f59e0b; color: #030712; border: none; padding: 14px; border-radius: 12px; font-weight: 900; font-size: 15px; cursor: pointer; margin-bottom: 16px; box-shadow: 0 4px 12px rgba(245, 158, 11, 0.4); }
    .btn-back { background: transparent; color: var(--text-muted); border: none; font-size: 13px; font-weight: 700; cursor: pointer; margin-top: 16px; width: 100%; text-align: center; display: block; }

    .tab-toggle { display: flex; gap: 6px; margin-bottom: 16px; }
    .tab-btn { flex: 1; background: var(--bg); border: 1px solid var(--card-border); color: var(--text-muted); padding: 9px 4px; border-radius: 8px; font-size: 11px; font-weight: 700; cursor: pointer; text-align: center; }
    .tab-btn.active { background: var(--card-border); color: #fff; border-color: var(--primary); }

    .payment-gateway-box { background: rgba(3, 7, 18, 0.95); border: 1px solid rgba(56, 189, 248, 0.4); border-radius: 16px; padding: 18px; margin-bottom: 18px; }
    .gateway-title { font-size: 15px; font-weight: 800; color: var(--primary); margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
    .gateway-desc { font-size: 12px; color: var(--text-muted); margin-bottom: 14px; line-height: 1.45; }
    .gateway-options { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 14px; }
    .gateway-badge-opt { background: rgba(17, 24, 39, 0.9); border: 1px solid var(--card-border); padding: 8px; border-radius: 10px; font-size: 11px; font-weight: 700; color: #fff; text-align: center; }
    .bank-transfer-info { background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.3); border-radius: 10px; padding: 12px; text-align: center; }
    .bank-transfer-info strong { color: #34d399; font-size: 13px; display: block; margin-top: 4px; }

    .kpi-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 20px; }
    .kpi-card { background: rgba(3, 7, 18, 0.8); border: 1px solid var(--card-border); border-radius: 12px; padding: 14px; text-align: center; }
    .kpi-number { font-size: 20px; font-weight: 900; color: var(--primary); margin-top: 4px; }
    .kpi-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; }

    .admin-item-card { background: rgba(3, 7, 18, 0.7); border: 1px solid var(--card-border); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
    .admin-item-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; gap: 8px; }
    .admin-item-title { font-size: 14px; font-weight: 800; color: #fff; }
    .admin-badge-rol { font-size: 10px; font-weight: 800; padding: 3px 8px; border-radius: 6px; text-transform: uppercase; white-space: nowrap; }
    .badge-admin { background: rgba(245, 158, 11, 0.2); color: #f59e0b; border: 1px solid rgba(245, 158, 11, 0.4); }
    .badge-empresa { background: rgba(56, 189, 248, 0.2); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.4); }
    .badge-candidato { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.4); }
    .badge-pago { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.45); }
    .admin-item-details { font-size: 12px; color: var(--text-muted); line-height: 1.5; }

    #floatingAdminBtn {
      position: fixed; bottom: 20px; right: 20px; background: #f59e0b; color: #030712; border: none;
      padding: 12px 18px; border-radius: 50px; font-weight: 900; font-size: 13px; box-shadow: 0 4px 15px rgba(245, 158, 11, 0.5); z-index: 999; cursor: pointer;
      display: none;
    }
